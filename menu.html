<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赛尔美餐厅 SMISS Restaurant · 在线点餐</title>
<style>
:root{
  --paper:#f5f0e4;
  --card:#fdfaf2;
  --ink:#2f3a34;
  --sub:#7a8078;
  --celadon:#5f7f79;
  --celadon-deep:#4c6b65;
  --gold:#b09a68;
  --cinnabar:#9e3b2c;
  --line:#ddd2ba;
  --shadow:0 6px 18px rgba(47,58,52,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"SimSun","宋体","Songti SC","STSong","Noto Serif SC",serif;
  background-color:var(--paper);
  background-image:radial-gradient(rgba(47,58,52,.05) 1px, transparent 1.3px);
  background-size:24px 24px;
  color:var(--ink);line-height:1.65;padding-bottom:100px;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}
/* ===== 顶栏 ===== */
.topbar{
  position:sticky;top:0;z-index:50;height:64px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;
  background:rgba(245,240,228,.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink)}
.brand b{font-size:18px;letter-spacing:4px;font-weight:700}
.brand span{font-size:12px;color:var(--celadon);letter-spacing:2px}
.brand-logo{height:20px;width:auto;object-fit:contain;align-self:center}
.top-actions{display:flex;align-items:center;gap:10px}
.admin-link{
  font-size:13px;color:var(--celadon);border:1px solid var(--celadon);
  padding:6px 12px;border-radius:5px;letter-spacing:1px;
  text-decoration:none;transition:all .15s;
}
.admin-link:hover{background:var(--celadon);color:#f6efe0}
.cart-btn{
  position:relative;display:flex;align-items:center;gap:6px;
  background:#fff;border:1px solid var(--line);
  padding:8px 14px;border-radius:5px;font-size:14px;font-weight:700;color:var(--celadon);
  letter-spacing:1px;transition:transform .15s;
}
.cart-btn:active{transform:scale(.96)}
.cart-badge{
  position:absolute;top:-7px;right:-7px;
  min-width:20px;height:20px;padding:0 5px;border-radius:999px;
  background:var(--cinnabar);color:#fff;font-size:11px;font-weight:700;
  display:none;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(158,59,44,.35);
}
.cart-badge.show{display:flex}
/* ===== Hero（与首页同款宋式） ===== */
.hero{
  position:relative;margin:18px 16px;border-radius:10px;
  padding:36px 24px 30px;text-align:center;
  background:var(--card);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.hero::before{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(47,58,52,.04) 1px,transparent 1.2px);
  background-size:24px 24px;
}
.moon{
  position:absolute;top:14px;right:16px;
  width:64px;height:64px;border-radius:50%;
  background:radial-gradient(circle at 38% 35%, rgba(248,244,232,.95), rgba(232,221,194,.4) 70%);
  box-shadow:0 0 40px rgba(232,221,194,.5);
}
.mount{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;pointer-events:none}
.hero-inner{position:relative;z-index:2;max-width:640px;margin:0 auto}
.hero-line{display:flex;align-items:center;justify-content:center;gap:18px}
.seal{
  width:52px;height:52px;flex:0 0 auto;
  background:var(--cinnabar);color:#f6efe0;
  font-size:15px;letter-spacing:2px;
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;box-shadow:0 4px 10px rgba(158,59,44,.3);
  border:1px solid rgba(246,239,224,.6);
}
.hero-logo,.hero-line{cursor:pointer}
.hero-line:hover h1{opacity:.75}
.hero-logo{height:28px;width:auto;max-width:110px;object-fit:contain;display:block;margin:0 auto 10px;filter:drop-shadow(0 2px 6px rgba(47,58,52,.18))}
.hero h1{font-size:clamp(30px,6vw,46px);font-weight:700;letter-spacing:10px;text-indent:10px}
.slogan-link{text-decoration:none;color:inherit;cursor:pointer;transition:opacity .2s}
.slogan-link:hover{opacity:.7;text-decoration:underline}
.slogan{
  margin-top:8px;
  font-family:"Kaiti SC","KaiTi","楷体",serif;
  font-size:16px;color:var(--celadon-deep);letter-spacing:3px;
}
.verse{
  font-family:"Kaiti SC","KaiTi","楷体",serif;
  font-size:clamp(16px,2.4vw,21px);
  letter-spacing:6px;color:var(--ink);margin-top:4px;
}
.verse.sub{font-size:clamp(14px,2vw,17px);color:var(--sub);letter-spacing:4px;margin-top:6px}
.divider{display:flex;align-items:center;gap:12px;margin:22px auto;width:min(240px,60%)}
.divider span{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.divider span:last-child{background:linear-gradient(90deg,var(--gold),transparent)}
.divider i{font-style:normal;color:var(--gold);font-size:9px}
.search{
  margin-top:20px;display:flex;align-items:center;gap:8px;
  background:#fffdf6;border:1px solid var(--line);border-radius:6px;padding:10px 16px;
  box-shadow:0 4px 12px rgba(47,58,52,.08);
  text-align:left;
}
.search input{flex:1;border:none;outline:none;font-size:14px;color:var(--ink);background:transparent}
.mybook-entry{margin-top:16px;border:1px solid var(--celadon);color:var(--celadon-deep);background:rgba(255,253,247,.85);border-radius:999px;padding:8px 22px;font-size:13px;letter-spacing:2px;cursor:pointer;font-family:inherit}
.mybook-entry:hover{background:rgba(95,127,121,.12)}
.search .icon{font-size:15px}
/* ===== 分类 ===== */
.cats{
  position:sticky;top:0;z-index:45;
  display:flex;gap:8px;overflow-x:auto;
  padding:10px 16px 12px;scrollbar-width:none;
  background:rgba(245,240,228,.96);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.cats::-webkit-scrollbar{display:none}
.cat-search-btn{position:sticky;right:0;flex:0 0 auto;margin-left:auto;width:34px;height:34px;border-radius:8px;background:var(--celadon);color:#f6efe0;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(95,127,121,.3);cursor:pointer}
.cat-search-panel{position:sticky;top:53px;z-index:44;background:rgba(245,240,228,.97);padding:8px 16px 10px;border-bottom:1px solid var(--line);display:none}
.cat-search-panel.show{display:block}
.cat-search-panel input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fffdf6;font-size:14px;outline:none}
.cat-chip{
  flex:0 0 auto;padding:7px 16px;border-radius:4px;
  background:transparent;border:1px solid var(--line);
  font-size:14px;color:var(--sub);font-weight:400;letter-spacing:2px;
  transition:all .18s ease;
}
.cat-chip.active{
  background:var(--celadon);color:#f6efe0;border-color:var(--celadon);
  box-shadow:0 3px 10px rgba(95,127,121,.3);
}
/* ===== 菜单 ===== */
.section-title{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 18px 12px;border-top:1px solid var(--line);
}
.section-title h2{font-size:18px;font-weight:700;letter-spacing:3px;display:flex;align-items:center;gap:8px}
.section-title h2::before{content:"◆";font-size:10px;color:var(--gold)}
.section-title span{font-size:12px;color:var(--sub);letter-spacing:1px}
.menu-grid{
  display:grid;grid-template-columns:1fr;
  max-width:640px;margin:0 auto;
  gap:20px;padding:0 16px 24px;
}
.dish{
  background:var(--card);border:1px solid var(--line);border-top:2px solid var(--celadon);
  border-radius:8px;overflow:hidden;box-shadow:var(--shadow);
  display:flex;flex-direction:column;position:relative;
  transition:transform .15s ease, box-shadow .15s ease;
}
.dish:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(47,58,52,.12)}
.dish::before,.dish::after{
  content:"";position:absolute;width:16px;height:16px;z-index:3;pointer-events:none;
}
.dish::before{top:7px;left:7px;border-top:1.5px solid var(--gold);border-left:1.5px solid var(--gold);opacity:.6}
.dish::after{bottom:7px;right:7px;border-bottom:1.5px solid var(--gold);border-right:1.5px solid var(--gold);opacity:.6}
.dish-photo{
  position:relative;width:100%;aspect-ratio:1/1;
  display:flex;align-items:center;justify-content:center;
  font-size:88px;border-bottom:1px solid var(--line);
}
.dish-photo .pop{
  position:absolute;top:12px;left:12px;z-index:2;
  background:var(--cinnabar);color:#f6efe0;
  font-size:11px;font-weight:400;letter-spacing:2px;
  padding:3px 9px;border-radius:3px;
  box-shadow:0 2px 6px rgba(158,59,44,.3);
}
.dish-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:1}
.dish-img.show{display:block}
.dish-photo .pop{z-index:2}
.dish-body{padding:12px 16px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.dish-overlay{
  position:absolute;left:0;bottom:0;z-index:4;width:100%;
  background:linear-gradient(90deg, rgba(8,14,12,.9) 0%, rgba(8,14,12,.65) 55%, rgba(8,14,12,.28) 82%, rgba(8,14,12,0) 100%);
  padding:6px 12px 7px;
  text-align:left;line-height:1.25;
}
.dish-overlay .cn{color:#fff;font-family:"FangSong","仿宋","FangSong_GB2312","STFangsong",serif;font-size:14px;font-weight:700;letter-spacing:1px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.dish-overlay .en{color:rgba(255,255,255,.82);font-size:9px;letter-spacing:.5px;margin-top:0;text-transform:uppercase}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{
  font-size:11px;padding:1px 8px;border-radius:2px;
  border:1px solid var(--gold);color:var(--gold);letter-spacing:1px;
}
.tag.hot{border-color:var(--cinnabar);color:var(--cinnabar)}
.tag.veg{border-color:var(--celadon);color:var(--celadon)}
.dish-foot{
  margin-top:auto;display:flex;align-items:center;justify-content:space-between;
  padding-top:8px;border-top:1px dashed var(--line);
}
.price{font-size:19px;font-weight:700;color:var(--cinnabar)}
.price small{font-size:11px;color:var(--sub);font-weight:400;margin-left:2px}
.stepper{display:flex;align-items:center;gap:4px}
.step-btn{
  width:30px;height:30px;border-radius:4px;
  background:var(--celadon);color:#f6efe0;font-size:17px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s ease;
}
.step-btn.minus{background:transparent;color:var(--celadon);border:1px solid var(--celadon)}
.step-btn:active{transform:scale(.9)}
.step-num{min-width:28px;text-align:center;font-weight:700;font-size:15px}
.add-btn{
  min-width:32px;height:32px;border-radius:4px;padding:0 7px;
  background:var(--celadon);color:#f6efe0;font-size:16px;font-weight:700;line-height:1;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 8px rgba(95,127,121,.3);
  white-space:nowrap;
}
.field input.invalid{border-color:var(--cinnabar)!important;box-shadow:0 0 0 2px rgba(158,59,44,.12)}
.empty{text-align:center;color:var(--sub);padding:60px 20px;font-size:14px;grid-column:1/-1;letter-spacing:1px}
.empty .e{font-size:46px;display:block;margin-bottom:12px}
/* ===== 底部悬浮栏 ===== */
.float-cart{
  position:fixed;left:16px;right:16px;bottom:16px;z-index:60;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--celadon-deep);color:#f4efe0;
  border-radius:10px;padding:13px 18px;
  box-shadow:0 10px 28px rgba(47,58,52,.35);
  border:1px solid rgba(176,154,104,.5);
  opacity:0;pointer-events:none;transform:translateY(18px);
  transition:opacity .28s ease,transform .28s ease;
}
.float-cart.show{opacity:1;pointer-events:auto;transform:none}
@keyframes pop{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.float-cart .total{display:flex;align-items:center;gap:4px;flex-shrink:0;background:#e5c878;color:#4c3316;padding:0 14px;height:46px;border-radius:8px;cursor:pointer;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.22);transition:transform .15s,background .15s;white-space:nowrap}
.float-cart .total:active{transform:scale(.97);background:#d9b964}
.fc-badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;margin-left:6px;border-radius:50%;background:var(--cinnabar);color:#fff;font-size:13px;font-weight:700;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.checkout-btn{
  background:var(--cinnabar);color:#f6efe0;
  padding:0 22px;height:46px;border-radius:8px;font-weight:700;font-size:14px;letter-spacing:2px;
  box-shadow:0 4px 10px rgba(158,59,44,.3);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit;
}
.checkout-btn .fc-total{margin-left:8px;font-size:16px;font-weight:800;letter-spacing:0;color:#ffd98a}
/* ===== 抽屉 ===== */
.overlay{
  position:fixed;inset:0;background:rgba(40,52,46,.45);
  opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:80;
}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(400px,92vw);
  background:var(--card);z-index:90;
  transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.25,1);
  display:flex;flex-direction:column;
  box-shadow:-10px 0 30px rgba(0,0,0,.18);
  border-left:1px solid var(--line);
}
.drawer.show{transform:none}
.drawer-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px 14px;
  border-top:3px double var(--gold);
  border-bottom:1px solid var(--line);
  background:#f8f2e1;
}
.drawer-head h3{font-size:17px;font-weight:700;letter-spacing:3px}
.close-btn{font-size:20px;color:var(--sub);line-height:1}
.cart-list{flex:1;overflow-y:auto;padding:10px 20px}
.cart-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.cart-item .ce{font-size:32px;width:44px;text-align:center;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.ci-img{width:44px;height:44px;object-fit:cover;border-radius:6px;display:block}
.cart-item .ce .ce-fallback{font-size:32px;line-height:1}
.cart-item .ci{flex:1;min-width:0}
.cart-item .cn{font-size:15px;font-weight:700}
.cart-item .cp{font-size:13px;color:var(--cinnabar);font-weight:700}
.cart-item .rm{font-size:12px;color:#a89c87;margin-top:2px}
.del-btn{color:#c0b29a;font-size:17px;flex:0 0 auto;transition:color .15s}
.del-btn:hover{color:var(--cinnabar)}
.cart-empty{text-align:center;color:var(--sub);padding:70px 20px;font-size:14px;letter-spacing:1px}
.cart-empty .e{font-size:50px;display:block;margin-bottom:14px}
.drawer-foot{padding:14px 20px 18px;border-top:1px solid var(--line);background:#f8f2e1}
.drawer-total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.drawer-total span{font-size:13px;color:var(--sub)}
.drawer-total b{font-size:25px;color:var(--cinnabar);font-weight:700}
/* ===== 结算弹窗 ===== */
.modal{
  position:fixed;inset:0;z-index:95;background:rgba(40,52,46,.5);
  display:none;align-items:center;justify-content:center;padding:16px;
}
.modal.show{display:flex}
.modal-card{
  background:var(--card);border-radius:10px;width:min(500px,100%);
  max-height:88vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  border-top:4px double var(--gold);
  animation:rise .3s cubic-bezier(.2,.8,.25,1);
}
@keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.modal-head{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:17px;font-weight:700;letter-spacing:3px}
.modal-body{padding:16px 22px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;letter-spacing:1px}
.field input,.field textarea,.field select{
  width:100%;padding:10px 12px;border-radius:5px;
  border:1px solid var(--line);font-size:14px;color:var(--ink);
  outline:none;background:#fffdf6;resize:none;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold);background:#fff}
.field-row{display:flex;gap:12px}
.field-row .field{flex:1}
.sec-title{
  font-size:14px;font-weight:700;letter-spacing:3px;color:var(--celadon-deep);
  border-bottom:1px solid var(--line);padding-bottom:6px;margin:16px 0 10px;
}
.sec-title:first-child{margin-top:0}
.order-items .oi{
  display:flex;align-items:center;gap:12px;padding:10px 0;
  border-bottom:1px dashed var(--line);
}
.order-items .oi:last-child{border-bottom:none}
.order-items .oe{font-size:26px;width:38px;text-align:center;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.order-items .ci-img{width:38px;height:38px;object-fit:cover;border-radius:5px;display:block}
.order-items .oe .ce-fallback{font-size:26px;line-height:1}
.order-items .on{flex:1;min-width:0;font-size:14px;font-weight:700}
.order-items .op{color:var(--cinnabar);font-size:14px;font-weight:700;white-space:nowrap}
.order-items .oi .del{color:#c0b29a;font-size:16px;flex:0 0 auto;padding:4px}
.order-items .oi .del:hover{color:var(--cinnabar)}
.summary{
  background:#f4ecda;border-radius:8px;padding:12px 16px;
  font-size:13px;color:var(--sub);margin:14px 0 4px;border:1px solid var(--line);
}
.summary .row{display:flex;justify-content:space-between;padding:4px 0}
.summary .row b{color:var(--ink)}
.summary .grand{font-size:15px;color:var(--ink);font-weight:700;border-top:1px dashed var(--line);margin-top:4px;padding-top:6px}
.summary .grand b{color:var(--cinnabar);font-size:19px}
.opt-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 16px;margin-bottom:10px;border:1px solid var(--line);border-radius:8px;background:#fffdf6;font-size:15px;cursor:pointer;transition:all .15s}
.opt-btn:hover{border-color:var(--celadon);background:#eef3ef}
.opt-btn .ob-p{color:var(--cinnabar);font-weight:700;font-size:16px}
.modal-foot{padding:14px 22px 20px}
.modal-foot.foot-split{display:flex;align-items:center;justify-content:space-between;gap:12px}
.modal-foot.foot-split .step-hint{font-size:13px;color:var(--sub);letter-spacing:1px;white-space:nowrap}
.modal-foot.foot-split .submit-btn{width:auto;padding:12px 24px;letter-spacing:2px}
.submit-btn{
  width:100%;padding:14px;border-radius:6px;
  background:var(--celadon);color:#f6efe0;
  font-size:16px;font-weight:700;letter-spacing:4px;
  box-shadow:0 6px 16px rgba(95,127,121,.3);
}
.submit-btn:hover{background:var(--celadon-deep)}
/* 下单成功 */
.success{text-align:center;padding:36px 26px 28px}
.success .s-emoji{font-size:58px}
.success h3{font-size:21px;font-weight:700;margin:12px 0 6px;color:var(--celadon-deep);letter-spacing:3px}
.success p{font-size:13px;color:var(--sub);margin:3px 0}
.success .order-no{
  display:inline-block;margin:14px 0;
  background:#f4ecda;color:var(--celadon-deep);font-weight:700;font-size:18px;letter-spacing:2px;
  padding:10px 24px;border-radius:6px;border:1px solid var(--line);
}
.csv-btn{
  display:block;margin:14px auto 0;padding:10px 26px;border-radius:5px;
  background:#fff;border:1px solid var(--celadon);color:var(--celadon);
  font-size:13px;letter-spacing:2px;transition:all .15s;
}
.csv-btn:hover{background:var(--celadon);color:#f6efe0}
.success .again-btn{
  margin-top:10px;padding:12px 30px;border-radius:5px;
  background:var(--celadon);color:#f6efe0;font-weight:700;font-size:14px;letter-spacing:2px;
  transition:transform .15s;
}
.success .again-btn:active{transform:scale(.96)}
.view-info, .view-items{
  text-align:left;background:#f4ecda;border:1px solid var(--line);border-radius:8px;

.toast{

  padding:10px 20px;border-radius:5px;z-index:120;
  opacity:0;pointer-events:none;transition:all .25s ease;max-width:86vw;text-align:center;
  letter-spacing:1px;border:1px solid rgba(176,154,104,.5);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

async function buildBaojianXlsx(o) {
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet("包间菜单");
  ws.views = [{ showGridLines: false }];
  const FONT = "微软雅黑";
  const thin = { style: "thin", color: { argb: "FF7F7F7F" } };
  const border = { top: thin, bottom: thin, left: thin, right: thin };
  ws.getColumn(1).width = 9.13;
  ws.getColumn(2).width = 9.75;
  ws.getColumn(3).width = 25.13;
  ws.getColumn(4).width = 21.25;
  ws.getColumn(5).width = 23.75;
  const r1 = ws.getRow(1); r1.height = 38;
  const c1 = r1.getCell(1); c1.value = "包间菜单";
  c1.font = { name: FONT, size: 18, bold: true };
  c1.alignment = { horizontal: "center", vertical: "middle" };
  ws.mergeCells("A1:E1");
  const r2 = ws.getRow(2); r2.height = 33;
  const c2 = r2.getCell(1);
  c2.value = "用餐时间：" + (o.date || "") + " " + (o.time || "") + "，用餐地点：" + (o.room || "西式包间") + "　" + "用餐人数：" + o.people + "　客户：" + (o.name || "");
  c2.font = { name: FONT, size: 12, bold: true };
  c2.alignment = { horizontal: "left", vertical: "middle" };
  ws.mergeCells("A2:E2");
  const r3 = ws.getRow(3); r3.height = 27;
  ["序号", "菜类", "菜名", "单价(RMB:元/份)", "备注"].forEach((h, i) => {
    const c = r3.getCell(i + 1);
    c.value = h;
    c.font = { name: FONT, size: 14, bold: true };
    c.alignment = { horizontal: "center", vertical: "middle" };
    c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFDDEBF7" } };
    c.border = border;
  });
  const items = o.items || [];
  let r = 4;
  items.forEach((it, i) => {
    const row = ws.getRow(r); row.height = 33;
    const d = MENU.find(x => x.id === it.id);
    const vals = [i + 1, d ? d.cat : "", it.name, it.price, it.qty > 1 ? "数量×" + it.qty : ""];
    vals.forEach((v, j) => {
      const cell = row.getCell(j + 1);
      cell.value = v;
      cell.font = { name: FONT, size: 12, bold: true };
      cell.alignment = { horizontal: "center", vertical: "middle" };
      cell.border = border;
    });
    r++;
  });
  const firstData = 4;
  const lastData = r - 1;
  if (items.length) {
    let runStart = firstData;
    for (let i = firstData + 1; i <= lastData + 1; i++) {
      const cur = i <= lastData ? ws.getCell("B" + i).value : undefined;
      const prev = ws.getCell("B" + (i - 1)).value;
      if (cur !== prev) {
        if (i - 1 > runStart) {
          ws.mergeCells("B" + runStart + ":B" + (i - 1));
          for (let rr = runStart; rr <= i - 1; rr++) ws.getCell("B" + rr).border = border;
        }
        runStart = i;
      }
    }
  }
  const rowT = ws.getRow(r); rowT.height = 32;
  const label = rowT.getCell(1); label.value = "小计(RMB:元/桌)";
  label.font = { name: FONT, size: 14, bold: true };
  label.alignment = { horizontal: "center", vertical: "middle" };
  label.border = border;
  rowT.getCell(2).border = border;
  rowT.getCell(3).border = border;
  const totalC = rowT.getCell(4); totalC.value = o.total;
  totalC.font = { name: FONT, size: 14, bold: true };
  totalC.alignment = { horizontal: "center", vertical: "middle" };
  totalC.border = border;
  rowT.getCell(5).border = border;
  ws.mergeCells("A" + r + ":C" + r);
  // 底部确认行：申请部门 / 申请人 / 部门负责人确认
  const rowC = ws.getRow(r + 1); rowC.height = 36;
  rowC.getCell(1).value = "申请部门：＿＿＿＿＿＿　　申请人：＿＿＿＿＿＿　　部门负责人确认：＿＿＿＿＿＿";
  rowC.getCell(1).font = { name: FONT, size: 12, bold: true };
  rowC.getCell(1).alignment = { horizontal: "center", vertical: "middle" };
  ws.mergeCells("A" + (r + 1) + ":E" + (r + 1));
  for (let cc = 1; cc <= 5; cc++) rowC.getCell(cc).border = border;
  return await wb.xlsx.writeBuffer();
}
async function exportBaojianXlsx(o) {
  if (typeof ExcelJS === "undefined") return toast("Excel 组件加载失败，请刷新重试");
  const buf = await buildBaojianXlsx(o);
  const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "包间菜单_" + o.no + ".xlsx";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

async function sbFetch(path, options = {}) {
  const timeout = options.timeout || 8000;
  let ctrl = null;
  if (typeof AbortController !== "undefined") ctrl = new AbortController();
  let timer = null;
  let resp;
  try {

    ...options,
    ...(ctrl ? { signal: ctrl.signal } : {}),
    headers: {
      "apikey": SUPABASE_KEY,

  } catch (e) {
    if (ctrl) { try { ctrl.abort(); } catch (e2) {} }

  } finally { if (timer) clearTimeout(timer); }
}

const DB_NAME = "swxc_db", STORE = "kv";
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbGet(key) {
  return new Promise((resolve, reject) => {
    try {
      idbOpen().then(db => {
        const r = db.transaction(STORE, "readonly").objectStore(STORE).get(key);
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      }).catch(reject);
    } catch (e) { reject(e); }
  });
}
function idbPut(key, val) {
  return new Promise((resolve, reject) => {
    try {
      idbOpen().then(db => {
        const tx = db.transaction(STORE, "readwrite");
        tx.objectStore(STORE).put(val, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      }).catch(reject);
    } catch (e) { reject(e); }
  });
}
const CAT_ORDER = ["汤羹", "汤", "粤菜", "川湘菜", "湖北菜", "凉菜", "素菜", "主食", "甜点", "饮品"];
function sortDishes(list) {
  return list.slice().sort((a, b) => {
    const ia = CAT_ORDER.indexOf(a.cat), ib = CAT_ORDER.indexOf(b.cat);
    const oa = ia === -1 ? 99 : ia, ob = ib === -1 ? 99 : ib;
    if (oa !== ob) return oa - ob;
    return String(a.name).localeCompare(String(b.name), "zh-Hans-CN");
  });
}

async function loadData() {
  let ok = false;
  try {
    // 先拉取菜单基础信息（不含大图），快速渲染首屏
    const rows = await sbFetch("menu?select=id,name,en,price,cat,emoji,tags,description,options&order=id", { timeout: 15000 });
    if (Array.isArray(rows)) {
      if (!rows.length) {
        const seed = DEFAULT_MENU.map(d => ({ id: d.id, name: d.name, en: d.en || "", price: d.price, cat: d.cat, description: d.desc || "", emoji: d.emoji, tags: d.tags || [], img: d.img || "" }));
        await sbFetch("menu", { method: "POST", body: JSON.stringify(seed) });
        rows.push(...seed);
      }
      const prevMap = {};
      MENU.forEach(d => { prevMap[d.id] = d.img || ""; });
      MENU = rows.map(r => ({
        id: r.id, name: r.name, en: r.en || "", price: +r.price, cat: r.cat,
        desc: r.description || "", emoji: r.emoji || "🍽️",
        tags: Array.isArray(r.tags) ? r.tags : [],
        img: prevMap[r.id] || "",
        options: Array.isArray(r.options) ? r.options : []
      }));
      CATS = ["全部", ...new Set(MENU.map(d => d.cat))];
      ok = true;
    }
  } catch (e) { ok = false; }
  if (!ok) {
    try {
      const cached = await idbGet("menu_full");
      if (Array.isArray(cached) && cached.length) {
        MENU = cached;
        CATS = ["全部", ...new Set(MENU.map(d => d.cat))];
        ok = true;
      }
    } catch (e) {}
    if (!ok) {
      MENU = DEFAULT_MENU;
      CATS = ["全部", ...new Set(DEFAULT_MENU.map(d => d.cat))];
    }
  }
  // 清理购物车里已不存在的菜品
  Object.keys(state.cart).forEach(id => { if (!MENU.some(d => d.id === +id)) delete state.cart[id]; });
  MENU = sortDishes(MENU);
  CATS = ["全部", ...new Set(MENU.map(d => d.cat))];
  menuImagesLoaded = true;
  renderMenu();
  // 图片量大，放后台异步拉取，不阻塞首屏；拉完再刷新图片并写缓存
  loadMenuImagesAsync();
}

async function loadMenuImagesAsync() {
  try {
    const imgRows = await sbFetch("menu?select=id,img&order=id", { timeout: 30000 });
    if (Array.isArray(imgRows) && imgRows.length) {
      const imgMap = {};
      imgRows.forEach(r => { imgMap[r.id] = r.img || ""; });
      let changed = false;
      MENU.forEach(d => { if (imgMap[d.id] && imgMap[d.id] !== d.img) { d.img = imgMap[d.id]; changed = true; } });

    }
  } catch (e) {}
}

const dishImgCache = {};
/* 图片加载失败：重试一次（带新参数绕过缓存），仍失败则隐藏显示 emoji */
function dishImgOnError(el) {
  try {
    if (el.dataset.tries) { el.classList.remove("show"); return; }
    el.dataset.tries = "1";
    const src = el.getAttribute("src") || "";
    if (src) el.src = src + (src.indexOf("?") > -1 ? "&r=" : "?r=") + Date.now();
  } catch (e) {}
}
function dishImgSrc(d) {
  if (d.img && d.img.trim()) return d.img;
  if (dishImgCache[d.id]) return dishImgCache[d.id];
  return "";
}
function dishIconHtml(d, cls) {
  cls = cls || "ce";
  const src = dishImgSrc(d);
  const img = src ? `<img class="ci-img" src="${esc(src)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'">` : "";
  const fb = `<span class="ce-fallback" style="${src ? "display:none" : ""}">${d.emoji}</span>`;
  return `<span class="${cls}${src ? " has-img" : ""}">${img}${fb}</span>`;
}
/* 本地图片探测缓存：同一道菜只探测一次，下次打开直接命中 */
const PROBE_KEY = "smiss_probe_v1";
function probeCache() { try { return JSON.parse(localStorage.getItem(PROBE_KEY) || "{}"); } catch (e) { return {}; } }
function setProbe(id, ext) {
  const c = probeCache();
  c[id] = ext || "";
  try { localStorage.setItem(PROBE_KEY, JSON.stringify(c)); } catch (e) {}
}
/* 全部图片立即加载：前 10 张优先，其余浏览器自动排队后台加载 */
function loadDishImages() {
  document.querySelectorAll(".dish-img:not(.show)").forEach((img, i) => {
    if (img.dataset.urgent === "1") tryLoadDishImage(img);
    else setTimeout(() => { if (!img.classList.contains("show")) tryLoadDishImage(img); }, i * 12);
  });
}
function tryLoadDishImage(imgEl) {
  const id = imgEl.dataset.dishid;
  if (!id) return;
  const cache = probeCache();
  if (cache[id] !== undefined) {
    if (cache[id]) { dishImgCache[id] = "images/" + id + "." + cache[id]; imgEl.src = dishImgCache[id]; imgEl.classList.add("show"); }
    return;
  }
  const exts = ["jpg", "jpeg", "png", "webp", "svg"];
  let tried = 0;
  (function next() {
    if (tried >= exts.length) { setProbe(id, ""); return; }
    const ext = exts[tried++];
    const probe = new Image();
    probe.onload = () => { dishImgCache[id] = "images/" + id + "." + ext; imgEl.src = dishImgCache[id]; imgEl.classList.add("show"); setProbe(id, ext); };
    probe.onerror = next;
    probe.src = "images/" + id + "." + ext;
  })();
}

/* ============ 购物车 ============ */
function dishOptions(d) {
  return (d && d.options && d.options.length) ? d.options : [{ label: "", price: d.price }];
}
function cartItems() {
  const items = [];
  Object.keys(state.cart).forEach(idStr => {
    const id = +idStr;
    const d = MENU.find(x => x.id === id);
    if (!d) return;
    const opts = dishOptions(d);
    const sel = state.cart[idStr] || {};
    Object.keys(sel).forEach(opt => {
      const qty = sel[opt];
      if (!qty) return;
      const o = opts.find(x => x.label === opt) || { label: opt, price: d.price };
      items.push({ id, name: d.name, option: opt, price: o.price, qty });
    });
  });
  return items;
}
function countItems() {
  return cartItems().reduce((s, it) => s + it.qty, 0);
}
function totalPrice() {
  return cartItems().reduce((s, it) => s + it.qty * it.price, 0);
}
function dishQty(id) {
  const sel = state.cart[id] || {};
  return Object.keys(sel).reduce((s, k) => s + sel[k], 0);
}
function addToCart(id, delta, option) {
  const d = MENU.find(x => x.id === id);
  if (!d) return;
  const opts = dishOptions(d);
  const optKey = option == null ? opts[0].label : option;
  const sel = state.cart[id] || {};
  const cur = sel[optKey] || 0;
  const next = cur + delta;
  if (next <= 0) {
    delete sel[optKey];
    if (!Object.keys(sel).length) delete state.cart[id];
  } else {
    sel[optKey] = next;
    state.cart[id] = sel;
  }
  saveCart();
  renderAll();
  if (modal.classList.contains("show")) { renderConfirmItems(); buildSummary(); }
}
function renderConfirmItems() {
  const items = cartItems();
  const el = $("confirmItems");
  if (!items.length) {
    el.innerHTML = `<div class="cart-empty" style="padding:18px 0"><span class="e">🛒</span>预订菜单还是空的<br>去挑几道好吃的吧～</div>`;
    return;
  }
  el.innerHTML = items.map(it => {
    const d = MENU.find(x => x.id === it.id);
    if (!d) return "";
    const opt = it.option ? '<span class="ob">（' + esc(it.option) + '）</span>' : "";
    return `<div class="oi static">${dishIconHtml(d, "oe")}<span class="on">${esc(d.name)}${opt}</span><span class="op">× ${it.qty}</span><span class="op">¥${it.price * it.qty}</span></div>`;
  }).join("");
}
function renderCart() {
  const items = cartItems();
  const n = items.reduce((a, it) => a + it.qty, 0);
  $("floatCart").classList.toggle("show", n > 0);
  $("fcCount").textContent = n;
  $("fcTotal").textContent = fmt(totalPrice());
  $("drawerTotal").textContent = fmt(totalPrice());
  const listEl = $("cartList");
  if (!items.length) {
    listEl.innerHTML = `<div class="cart-empty"><span class="e">🛒</span>预订菜单还是空的<br>去挑几道好吃的吧～</div>`;
    return;
  }
  listEl.innerHTML = items.map(it => {
    const d = MENU.find(x => x.id === it.id);
    if (!d) return "";
    const optHtml = it.option ? `<div class="cp">${esc(it.option)} · ¥${it.price} / 份</div>` : `<div class="cp">¥${it.price} / 份</div>`;
    return `
    <div class="cart-item">
      ${dishIconHtml(d)}
      <div class="ci">
        <div class="cn">${esc(d.name)}</div>
        ${optHtml}
        <div class="rm">小计 ¥${it.price * it.qty}</div>
      </div>
      <div class="stepper">
        <button class="step-btn minus" data-id="${it.id}" data-opt="${esc(it.option)}" type="button">−</button>
        <span class="step-num">${it.qty}</span>
        <button class="step-btn plus" data-id="${it.id}" data-opt="${esc(it.option)}" type="button">+</button>
      </div>
      <button class="del-btn" data-id="${it.id}" data-opt="${esc(it.option)}" type="button" title="删除">🗑️</button>
    </div>`;
  }).join("");
}

document.addEventListener("click", e => {
  const add = e.target.closest(".add-btn");
  const plus = e.target.closest(".plus");
  const minus = e.target.closest(".minus");
  const del = e.target.closest(".del-btn");
  const del2 = e.target.closest(".del");
  if (add) {
    const ad = MENU.find(x => x.id === +add.dataset.id);
    if (ad && ad.options && ad.options.length) openOptPicker(+add.dataset.id);
    else { soupHint(+add.dataset.id); addToCart(+add.dataset.id, 1); }
  }
  else if (plus) {
    const pd = MENU.find(x => x.id === +plus.dataset.id);
    if (pd && pd.options && pd.options.length) openOptPicker(+plus.dataset.id);
    else { soupHint(+plus.dataset.id); addToCart(+plus.dataset.id, 1, plus.dataset.opt || null); }
  }
  else if (minus) {
    const mId = +minus.dataset.id;
    const md = MENU.find(x => x.id === mId);
    if (md && md.options && md.options.length) {
      const sel = state.cart[mId];
      const keys = sel ? Object.keys(sel) : [];
      if (keys.length) addToCart(mId, -1, keys[keys.length - 1]);
    } else { addToCart(mId, -1, minus.dataset.opt || null); }
  }
  else if (del || del2) { addToCart(+(del || del2).dataset.id, -999, (del || del2).dataset.opt || null); toast("已移除"); }
});

function getOrderHints() {
  const hints = [];
  const people = parseInt($("fPeople").value, 10) || 1;
  const cnt = countItems();
  const suggested = people + 2;
  if (cnt < suggested) {
    hints.push("您 " + people + " 人用餐，正常点菜数量约 " + suggested + " 道（当前已点 " + cnt + " 道）。");
  }
  const cats = new Set(MENU.filter(d => state.cart[d.id]).map(d => d.cat));
  const missing = [];
  if (!["汤羹", "汤"].some(c => cats.has(c))) missing.push("汤盅");
  if (!cats.has("主食")) missing.push("主食");
  if (!cats.has("饮品")) missing.push("饮品");
  if (missing.length) {
    hints.push("您还没有点：" + missing.join("、") + "，建议补充。");
  const soupQty = MENU.filter(d => ["汤羹", "汤"].includes(d.cat) && dishQty(d.id)).reduce((s, d) => s + dishQty(d.id), 0);
  if (soupQty > 0 && soupQty < people) {
    hints.push("汤盅按用餐人数点，您 " + people + " 人用餐，建议点 " + people + " 盅（当前已点 " + soupQty + " 盅）。");
  }
  }
  return hints;
}

  const by = $("fBy").value.trim();

  const ids = Object.keys(state.cart).map(Number).filter(id => MENU.some(d => d.id === id));
  const items = cartItems().map(it => ({ id: it.id, name: it.name, option: it.option, price: it.price, qty: it.qty }));
  const orderNo = "ORD" + Date.now().toString().slice(-6);
  const order = { id: Date.now(), no: orderNo, name, phone, dept, by, date, time, people, note, room, items, total: totalPrice(), ts: Date.now() };
  const conflict = await checkRoomConflict(order.room, order.date, order.time);
  if (conflict) { showConflict(conflict); return; }
  let cloudOk = false;
  try {
    await sbFetch("orders", {
      method: "POST",

    });

  } catch (err) { cloudOk = false; }
  if (!cloudOk) {
    try {
      const list = (await idbGet("orders")) || [];
      list.push(order);
      await idbPut("orders", list);
    } catch (err) {}

  lastOrder = order;
  $("orderNo").textContent = "#" + orderNo;
  $("stepInfo").style.display = "none";
  $("stepConfirm").style.display = "none";
  $("successView").style.display = "block";
  const sent = await sendEmail({
    subject: "【赛尔美餐厅】新订单通知 " + order.no,
    message: "订单号：" + order.no + "\n客户：" + order.name + "\n联系电话：" + order.phone + "\n预订部门：" + (order.dept || "—") + "\n预订人：" + (order.by || "—") + "\n用餐日期：" + order.date + " " + order.time + "\n用餐人数：" + order.people + " 人\n备注：" + (order.note || "无") + "\n菜品：" + order.items.map(i => i.name + (i.option ? "（" + i.option + "）" : "") + "×" + i.qty).join("、") + "\n合计：¥" + order.total + "\n包间菜单下载：https://smi100524.github.io/restaurant/menu.html?export=" + order.no,
    no: order.no, customer: order.name, phone: order.phone, dept: order.dept || "", booker: order.by || "",
    date: order.date, time: order.time, people: order.people, note: order.note || "",
    items: order.items.map(i => i.name + (i.option ? "（" + i.option + "）" : "") + "×" + i.qty).join("、"), total: order.total,
    download_url: "https://smi100524.github.io/restaurant/menu.html?export=" + order.no
  });
  toast(sent ? "🎉 预订已确认，已邮件通知" : "🎉 预订已确认");
  state.cart = {};
  saveCart();
  $("fNote").value = ""; $("fName").value = ""; $("fPhone").value = ""; $("fDept").value = ""; $("fBy").value = "";
}

function fmtDateCN(dateStr) {
  if (!dateStr) return "";
  const p = String(dateStr).split("-");
  if (p.length < 3) return dateStr;
  return p[0] + "年" + p[1] + "月" + p[2] + "日";
}
function wrapText(t, n) {
  const res = [];
  let s = String(t == null ? "" : t);
  while (s.length > n) { res.push(s.slice(0, n)); s = s.slice(n); }
  if (s) res.push(s);
  return res.length ? res : [""];
}
function roundRect(ctx, x, y, w, h, r, stroke) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  if (stroke) ctx.stroke(); else ctx.fill();
}
function drawDivider(ctx, cx, y, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx - 190, y); ctx.lineTo(cx - 26, y);
  ctx.moveTo(cx + 26, y); ctx.lineTo(cx + 190, y);
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.font = "16px serif";
  ctx.textAlign = "center";
  ctx.fillText("◆", cx, y + 6);
}
function buildInviteLines(o) {

/* 两端对齐绘制：把文字均匀撑满 [x0,x1] */
function fillTextJustify(ctx, text, x0, x1, baseline) {
  const s = String(text == null ? "" : text);
  if (!s) return;
  const avail = x1 - x0;
  const w = ctx.measureText(s).width;
  if (w >= avail || s.length < 2) { ctx.fillText(s, x0, baseline); return; }
  const gap = (avail - w) / (s.length - 1);
  let x = x0;
  for (let i = 0; i < s.length; i++) {
    ctx.fillText(s.charAt(i), x, baseline);
    x += ctx.measureText(s.charAt(i)).width + gap;
  }
}
/* 按实际文字宽度换行 */
function wrapTextWidth(ctx, text, maxWidth) {
  const res = [];
  let line = "";
  const s = String(text == null ? "" : text);
  for (let i = 0; i < s.length; i++) {
    const ch = s.charAt(i);
    if (line && ctx.measureText(line + ch).width > maxWidth) { res.push(line); line = ch; }
    else line += ch;
  }
  if (line) res.push(line);
  return res.length ? res : [""];
}
/* 水墨远山（复用首页的山水云纹） */
function drawInkWash(ctx, W, H) {
  const sx = W / 1440, bh = H * 0.22, sy = bh / 360, base = H - 4;
  const bands = [
    { color: "#5f7f79", opacity: 0.10, start: [0, 220], segs: [[[180, 150], [260, 260], [430, 190]], [[600, 120], [760, 240], [940, 170]], [[1100, 110], [1260, 210], [1440, 150]]] },
    { color: "#5f7f79", opacity: 0.07, start: [0, 285], segs: [[[160, 235], [320, 305], [520, 245]], [[720, 185], [900, 295], [1120, 235]], [[1280, 185], [1380, 255], [1440, 225]]] },
    { color: "#b09a68", opacity: 0.08, start: [0, 325], segs: [[[300, 265], [520, 335], [760, 285]], [[980, 245], [1220, 325], [1440, 275]]] }
  ];
  bands.forEach(function (b) {
    ctx.save();
    ctx.globalAlpha = b.opacity;
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.moveTo(b.start[0] * sx, base - (360 - b.start[1]) * sy);
    b.segs.forEach(function (sg) {
      ctx.bezierCurveTo(sg[0][0] * sx, base - (360 - sg[0][1]) * sy, sg[1][0] * sx, base - (360 - sg[1][1]) * sy, sg[2][0] * sx, base - (360 - sg[2][1]) * sy);
    });
    ctx.lineTo(W, base);
    ctx.lineTo(0, base);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  });
}
/* 布局：左栏（占满整页，菜名居中+英文小字） + 右栏（餐厅名/诗句 / 信息 / 竖版照片 / logo） */
function layoutInvite(ctx, content, W) {
  const LEFT_X = 64, LEFT_W = 400, RIGHT_X = 486, RIGHT_W = 448;
  const pad = 26, dishGap = 16;
  const fontCN = "27px KaiTi, STKaiti, 楷体, serif";
  const fontEN = "13px Georgia, \"Times New Roman\", serif";
  const fontVal = "20px SimSun, \"Songti SC\", \"Noto Serif SC\", serif";
  const PHOTO_W = 300, PHOTO_H = 470;
  // 左栏内容：每道菜（中文居中 + 英文小字）
  ctx.font = fontCN;
  const dishRows = (content.dishes.length ? content.dishes : [{ cn: "—", en: "" }]).map(function (dd) {
    const cnLines = wrapTextWidth(ctx, dd.cn, LEFT_W - pad * 2);
    ctx.font = fontEN;
    const enLines = dd.en ? wrapTextWidth(ctx, dd.en, LEFT_W - pad * 2) : [];
    ctx.font = fontCN;
    return { cn: dd.cn, en: dd.en, cnLines: cnLines, enLines: enLines };
  });
  let leftContent = 78;
  dishRows.forEach(function (r) {
    leftContent += r.cnLines.length * 34 + (r.enLines.length ? 16 + r.enLines.length * 16 : 6) + dishGap;
  });
  // 右栏
  ctx.font = fontVal;
  const infoLines = content.rows.map(function (r) {
    return { label: r.label, lines: wrapTextWidth(ctx, r.value, RIGHT_W - pad * 2 - 132) };
  });
  const infoCount = infoLines.reduce(function (s, r) { return s + r.lines.length; }, 0);
  const brandTopH = 225;
  const infoH = 40 + infoCount * 26 + Math.max(0, infoCount - 1) * 2 + 16;
  const brandBottomH = 116;
  const rightContent = brandTopH + infoH + PHOTO_H + brandBottomH + 42;
  const contentHeight = Math.max(leftContent, rightContent, 1300);
  const height = 52 + contentHeight + 64;
  return {
    LEFT_X: LEFT_X, LEFT_W: LEFT_W, RIGHT_X: RIGHT_X, RIGHT_W: RIGHT_W,
    pad: pad, dishGap: dishGap, fontCN: fontCN, fontEN: fontEN, fontVal: fontVal,
    PHOTO_W: PHOTO_W, PHOTO_H: PHOTO_H, dishRows: dishRows, infoLines: infoLines,
    infoH: infoH, brandTopH: brandTopH, brandBottomH: brandBottomH,
    contentHeight: contentHeight, contentTop: 52, height: height
  };
}

}
function paintInvite(cv, ctx, W, H, o, logo, content, room) {
  if (!content) content = buildInviteLines(o);
  const L = layoutInvite(ctx, content, W);
  const paper = "#f6f1e4", ink = "#2f3a34", sub = "#7a8078", cinnabar = "#9e3b2c", gold = "#b09a68", labelC = "#8a674d", valC = "#333333";
  ctx.fillStyle = paper;

  drawInkWash(ctx, W, H);

  ctx.lineWidth = 1;
  ctx.strokeStyle = "rgba(176,154,104,.5)";

  const ct = L.contentTop, ch = L.contentHeight;
  // ===== 左栏：菜单（占满整页，菜名居中 + 英文小字） =====
  const lx = L.LEFT_X, lw = L.LEFT_W;
  ctx.fillStyle = "rgba(255,252,244,.72)";

  ctx.strokeStyle = "rgba(176,154,104,.5)";
  ctx.beginPath(); ctx.moveTo(lx + 40, ct + 70); ctx.lineTo(lx + lw - 40, ct + 70); ctx.stroke();
  // 菜多菜少：按数量自动调间隔，填满下方空间；名称两端对齐
  var titleBottom = ct + 96;
  var availH = ct + ch - 26 - titleBottom;
  var contentH = 0;
  L.dishRows.forEach(function (r) { contentH += r.cnLines.length * 32 + (r.enLines.length ? 16 + r.enLines.length * 15 : 4); });
  var n = L.dishRows.length || 1;
  var gap = Math.max(8, Math.min(62, (availH - contentH) / (n + 1)));
  var totalUsed = contentH + gap * (n - 1);
  var ly = titleBottom + Math.max(0, (availH - totalUsed) / 2);
  var lcx = lx + lw / 2;
  ctx.textAlign = "center";
  L.dishRows.forEach(function (r) {
    var b = ly;
    ctx.font = L.fontCN;

    for (var i = 0; i < r.cnLines.length; i++) { ctx.fillText(r.cnLines[i], lcx, b); b += 32; }
    if (r.enLines.length) {
      var eb = b - 32 + 16;
      ctx.font = L.fontEN;
      ctx.fillStyle = gold;
      for (var j = 0; j < r.enLines.length; j++) { ctx.fillText(String(r.enLines[j]).toUpperCase(), lcx, eb); eb += 15; }
      b = eb - 15 + 2;
    } else {
      b += 2;
    }
    ly = b + gap;
  });

  // ===== 右栏 =====
  const rx = L.RIGHT_X, rw = L.RIGHT_W, cx = rx + rw / 2;
  // 顶部：赛尔美餐厅 + SMISS
  ctx.textAlign = "center";
  ctx.fillStyle = ink;
  ctx.font = "bold 46px SimSun, \"Songti SC\", \"Noto Serif SC\", serif";
  ctx.fillText("赛尔美餐厅", cx, ct + 58);
  ctx.fillStyle = gold;
  ctx.font = "21px Arial, sans-serif";
  ctx.fillText("S M I S S   R E S T A U R A N T", cx, ct + 94);
  ctx.fillStyle = ink;
  ctx.font = "30px KaiTi, STKaiti, 楷体, serif";
  ctx.fillText("一席烟火气，万般皆如意", cx, ct + 142);
  ctx.fillStyle = cinnabar;
  ctx.font = "24px SimSun, \"Songti SC\", \"Noto Serif SC\", serif";
  ctx.fillText("欢迎品鉴 · 共赴食光", cx, ct + 184);
  ctx.fillStyle = gold;
  ctx.font = "italic 19px Georgia, serif";
  ctx.fillText("your life, we care!", cx, ct + 220);

  // 预订信息
  const infoTop = ct + L.brandTopH;
  ctx.fillStyle = cinnabar;
  ctx.font = "bold 27px KaiTi, STKaiti, 楷体, serif";
  ctx.fillText("预 订 信 息", cx, infoTop + 36);
  ctx.strokeStyle = "rgba(176,154,104,.5)";
  ctx.beginPath(); ctx.moveTo(rx + 44, infoTop + 52); ctx.lineTo(rx + rw - 44, infoTop + 52); ctx.stroke();
  const colonX = rx + L.pad + 118, valX = rx + L.pad + 132;
  let ry = infoTop + 70;
  L.infoLines.forEach(function (r) {

    ctx.fillStyle = labelC;
    ctx.font = L.fontVal;
    ctx.fillText(r.label + "：", colonX, ry + 7);
    ctx.textAlign = "left";
    ctx.fillStyle = valC;
    r.lines.forEach(function (ln, i) { ctx.fillText(ln, valX, ry + 7 + i * 26); });

  });

  if (room && room.naturalWidth) {
    const scale = Math.max(pw / room.naturalWidth, ph / room.naturalHeight);

    ctx.restore();
    ctx.strokeStyle = "rgba(176,154,104,.7)";
    ctx.lineWidth = 1.5;
    roundRect(ctx, px0, photoTop, pw, ph, 10, true);
  } else {
    ctx.fillStyle = "#efe7d6";
    roundRect(ctx, px0, photoTop, pw, ph, 10, false);

  document.body.style.overflow = "hidden";
}

    await buildBaojianXlsxFile(o);
    showExportDone();
  } catch (err) {
    showExportOverlay("⚠️ 生成失败", "未找到订单 " + no + "，请核对链接是否正确，或稍后重试。", true);
  }
}

/* ============ 启动 ============ */
(async function init() {
  loadCart();
  const urlNo = new URLSearchParams(location.search).get("export");
  if (urlNo) showExportOverlay("正在生成包间菜单…", "正在读取订单 " + urlNo + " 的数据，请稍候", false);
  loadEmailCfg();
  // ① 缓存优先：有本地缓存（含图片、规格）立即渲染，秒开
  try {
    const cached = await idbGet("menu_full");
    if (Array.isArray(cached) && cached.length) {
      MENU = sortDishes(cached);
      CATS = ["全部", ...new Set(MENU.map(d => d.cat))];
      menuImagesLoaded = true;
      renderCats();
      renderAll();
    }
  } catch (e) {}
  // ② 后台拉取云端最新数据并刷新
  await loadData();
  renderCats();
  renderAll();
  waitImagesThenHide();
  setTimeout(function () { var pl = document.getElementById("pageLoader"); if (pl) pl.classList.add("done"); }, 8000);
  handleExportLink();
})();
</script>
<audio id="bgMusic" src="music/bg.wav" loop preload="auto"></audio>
<button id="musicBtn" type="button" title="背景音乐" aria-label="背景音乐">🎵</button>
<style>
#musicBtn{position:fixed;top:14px;right:14px;z-index:500;width:38px;height:38px;border-radius:50%;border:1px solid rgba(176,154,104,.6);background:rgba(255,252,244,.92);color:#5f7f79;font-size:17px;cursor:pointer;box-shadow:0 3px 10px rgba(47,58,52,.22);display:flex;align-items:center;justify-content:center;transition:transform .15s;-webkit-tap-highlight-color:transparent}
#musicBtn:active{transform:scale(.92)}
#musicBtn.off{opacity:.6}
</style>
<script>
(function(){
  var a=document.getElementById("bgMusic");
  var b=document.getElementById("musicBtn");
  if(!a||!b) return;
  a.volume=0.4;
  var playing=false;
  function setOn(on){ playing=on; b.classList.toggle("off",!on); b.textContent=on?"🎵":"🔇"; }
  function tryPlay(){
    if(!a) return;
    var p=a.play();
    if(p&&p.then){ p.then(function(){ setOn(true); }).catch(function(){}); }
  }
  setOn(false);
  tryPlay(); /* 部分浏览器会拦截，首次交互再触发 */
  function firstGesture(){ tryPlay(); }
  document.addEventListener("touchstart", firstGesture, {once:true});
  document.addEventListener("touchend", firstGesture, {once:true});
  document.addEventListener("click", firstGesture, {once:true});
  b.addEventListener("click", function(e){
    e.stopPropagation();
    if(a.paused){ tryPlay(); } else { a.pause(); setOn(false); }
  });
})();
</script>

</body>
