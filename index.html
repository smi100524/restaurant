<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赛尔美餐厅 SMISS Restaurant · 首页</title>
<style>
:root{
  --paper:#f5f0e4;
  --ink:#2f3a34;
  --sub:#7a8078;
  --celadon:#5f7f79;
  --celadon-deep:#4c6b65;
  --cinnabar:#9e3b2c;
  --gold:#b09a68;
  --line:#ddd2ba;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"SimSun","宋体","Songti SC","STSong","Noto Serif SC",serif;
  background:var(--paper);color:var(--ink);line-height:1.8;
  padding-bottom:76px;
}
.poem{font-family:"Kaiti SC","KaiTi","楷体","STKaiti",serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
/* ===== 顶栏 ===== */
.topbar{
  position:sticky;top:0;z-index:50;height:64px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;
  background:rgba(245,240,228,.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink)}
.brand b{font-size:18px;letter-spacing:4px;font-weight:700}
.brand span{font-size:12px;color:var(--celadon);letter-spacing:2px}
.brand-logo{height:20px;width:auto;object-fit:contain;align-self:center}
nav{display:flex;gap:4px}
nav a{
  padding:6px 14px;font-size:14px;letter-spacing:2px;color:var(--sub);
  text-decoration:none;border-bottom:2px solid transparent;transition:all .15s;
}
nav a:hover{color:var(--ink)}
nav a.active{color:var(--ink);border-bottom-color:var(--celadon)}
/* ===== Hero ===== */
.hero{
  position:relative;min-height:82vh;
  display:flex;align-items:center;justify-content:center;text-align:center;
  overflow:hidden;padding:80px 20px 52px;
}
.hero::before{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(47,58,52,.045) 1px,transparent 1.2px);
  background-size:26px 26px;
}
.moon{
  position:absolute;top:9%;right:13%;
  width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle at 38% 35%, rgba(248,244,232,.95), rgba(232,221,194,.4) 70%);
  box-shadow:0 0 70px rgba(232,221,194,.55);opacity:.9;
}
.mount{position:fixed;left:0;right:0;bottom:0;width:100%;height:auto;pointer-events:none;z-index:5;opacity:.9}
.hero-inner{position:relative;z-index:2;max-width:840px;padding:0 20px}
.kicker{font-size:13px;letter-spacing:9px;color:var(--gold);text-transform:uppercase;margin-bottom:20px}
.title-row{display:flex;align-items:center;justify-content:center;gap:20px}
.seal{
  width:58px;height:58px;flex:0 0 auto;
  background:var(--cinnabar);color:#f6efe0;
  font-size:16px;letter-spacing:2px;line-height:1.4;
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;box-shadow:0 4px 10px rgba(158,59,44,.3);
  border:1px solid rgba(246,239,224,.6);
}
.hero-logo{height:28px;width:auto;max-width:110px;object-fit:contain;display:block;margin:0 auto 10px;filter:drop-shadow(0 2px 6px rgba(47,58,52,.18))}
h1.cn{
  font-size:clamp(42px,8vw,70px);font-weight:700;
  letter-spacing:14px;text-indent:14px;
}
.slogan-link{text-decoration:none;color:inherit;cursor:pointer;transition:opacity .2s}
.slogan-link:hover{opacity:.7;text-decoration:underline}
.slogan{
  margin-top:12px;
  font-family:"Kaiti SC","KaiTi","楷体",serif;
  font-size:clamp(16px,2.4vw,21px);
  color:var(--celadon-deep);letter-spacing:3px;
}
.divider{display:flex;align-items:center;gap:14px;margin:28px auto;width:min(320px,70%)}
.divider span{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.divider span:last-child{background:linear-gradient(90deg,var(--gold),transparent)}
.divider i{font-style:normal;color:var(--gold);font-size:9px}
.verse{
  font-family:"Kaiti SC","KaiTi","楷体",serif;
  font-size:clamp(18px,2.6vw,24px);
  letter-spacing:7px;color:var(--ink);
}
.verse.sub{
  margin-top:8px;font-size:clamp(15px,2vw,18px);
  color:var(--sub);letter-spacing:4px;
}
.book-btn{
  margin-top:38px;display:inline-block;
  background:var(--celadon);color:#f6f1e2;
  font-size:16px;letter-spacing:6px;
  padding:15px 46px;border-radius:6px;
  box-shadow:0 8px 20px rgba(95,127,121,.35);
  transition:all .2s ease;
}
.book-btn:hover{background:var(--celadon-deep);transform:translateY(-2px)}
.book-btn.big{font-size:17px;padding:17px 58px}

/* ===== 底部悬浮预订 ===== */
.book-float{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:14px 20px calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(245,240,228,.94) 55%)}
.book-float-btn{pointer-events:auto;background:var(--celadon);color:#f6f1e2;font-size:16px;letter-spacing:6px;padding:13px 48px;border-radius:999px;border:1px solid rgba(255,255,255,.4);box-shadow:0 10px 26px rgba(47,58,52,.3);transition:all .2s}
.book-float-btn:hover{background:var(--celadon-deep);transform:translateY(-2px)}

/* ===== 包间展示 ===== */
.rooms{padding:20px 20px 46px;text-align:center}
.rooms-title{font-family:"Kaiti SC","KaiTi","楷体",serif;font-size:21px;letter-spacing:8px;color:var(--ink);margin-bottom:6px}
.rooms-sub{font-size:11px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:28px}
.rooms-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,320px));gap:26px;justify-content:center}
.room-card{margin:0;background:rgba(255,252,244,.6);border:1px solid var(--line);border-radius:12px;padding:12px 12px 18px;box-shadow:0 14px 36px rgba(47,58,52,.10)}

/* ===== 特色 ===== */
/* ===== 菜品展示 ===== */
.showcase{padding:58px 20px 34px;text-align:center}
.showcase-title{font-family:"Kaiti SC","KaiTi","楷体",serif;font-size:21px;letter-spacing:8px;color:var(--ink);margin-bottom:6px}
.showcase-sub{font-size:11px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:28px}
.showcase-frame{display:inline-block;max-width:min(360px,86vw);background:linear-gradient(180deg,#fbf6ea,#f1e9d7);border:1px solid var(--line);border-radius:10px;padding:14px 12px 16px;box-shadow:0 20px 48px rgba(47,58,52,.16)}
.showcase-roll{height:9px;border-radius:5px;background:linear-gradient(180deg,#b09a68,#8f7c50);margin:0 2px;box-shadow:0 1px 2px rgba(0,0,0,.18)}

.showcase-note{margin-top:24px;font-family:"Kaiti SC","KaiTi","楷体",serif;font-size:14px;letter-spacing:5px;color:var(--sub)}
.showcase-note b{color:var(--cinnabar);font-weight:400}

.features{
  max-width:980px;margin:0 auto;padding:20px 20px 70px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:22px;

.feat{

.r-list .row{

/* ===== Toast ===== */
.toast{
  position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-16px);
  background:rgba(40,52,46,.94);color:#f4efe0;font-size:13px;
  padding:10px 20px;border-radius:5px;z-index:120;
  opacity:0;pointer-events:none;transition:all .25s ease;max-width:86vw;text-align:center;

}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:720px){

  .brand span{font-size:10px}

  .hero{padding:56px 14px 44px}
  .kicker{font-size:11px;letter-spacing:5px;margin-bottom:16px}
  .seal{width:46px;height:46px;font-size:13px}
  .hero-logo{height:22px;max-width:70px}
  h1.cn{letter-spacing:6px;text-indent:6px}
  .slogan{font-size:15px;letter-spacing:2px}
  .verse{font-size:17px;letter-spacing:4px}

  .divider{margin:22px auto}

  .feat{padding:22px 18px}

  .confirm-ops button{letter-spacing:2px}

</style>

/* ============ 小工具 ============ */
const $ = id => document.getElementById(id);

/* ============ 预订数据保存（本机） ============ */
const DB_NAME = "swxc_db", STORE = "kv";
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbGet(key) {
  return new Promise((resolve, reject) => {
    idbOpen().then(db => {
      const r = db.transaction(STORE, "readonly").objectStore(STORE).get(key);
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    }).catch(reject);
  });
}
function idbPut(key, val) {
  return new Promise((resolve, reject) => {
    idbOpen().then(db => {
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).put(val, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    }).catch(reject);
  });
}

  if (!resp.ok) throw new Error("supabase " + resp.status);
  return resp.status === 204 ? null : resp.json();
  } catch (e) { throw e; } finally { clearTimeout(timer); }
}

/* ============ 预订弹窗 ============ */
const modal = $("bookModal"), form = $("bookForm"), confirmView = $("bookConfirm");
function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function openBook() {
  if (!$("bDate").value) $("bDate").value = todayStr();
  modal.classList.add("show");
  document.body.style.overflow = "hidden";
}
function closeBook() {
  modal.classList.remove("show");
  document.body.style.overflow = "";
}
$("bookBtn").addEventListener("click", openBook);
$("closeBook").addEventListener("click", closeBook);
modal.addEventListener("click", e => { if (e.target === modal) closeBook(); });

let pending = null;
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function readForm() {
  return {
    name: $("bName").value.trim(),
    phone: $("bPhone").value.trim(),
    dept: $("bDept").value.trim(),
    by: $("bBy").value.trim(),
    date: $("bDate").value,
    time: $("bTime").value,
    people: parseInt($("bPeople").value, 10) || 1,
    note: $("bNote").value.trim()
  };
}
function renderConfirm(r) {
  const rows = [
    ["客户", r.name],
    ["联系电话", r.phone],
    ["预订部门", r.dept || "—"],
    ["预订人", r.by || "—"],
    ["用餐日期", r.date],
    ["用餐时间", r.time],
    ["用餐人数", r.people + " 人"],
    ["备注", r.note || "无"]
  ];
  $("rList").innerHTML = rows.map(([k, v]) => `<div class="row"><span>${k}</span><b>${esc(v)}</b></div>`).join("");
}
form.addEventListener("submit", e => {
  e.preventDefault();
  const data = readForm();
  if (!data.name) return toast("请填写客户名称");
  if (!data.phone) return toast("请填写联系电话");
  if (!data.date) return toast("请选择用餐日期");
  if (!data.time) return toast("请选择用餐时间");
  pending = data;
  renderConfirm(data);
  form.style.display = "none";
  confirmView.style.display = "block";
});
$("bookBack").addEventListener("click", () => {
  confirmView.style.display = "none";
  form.style.display = "";
});
$("bookConfirmBtn").addEventListener("click", async () => {
  if (!pending) return;
  const rec = { id: Date.now(), ...pending, ts: Date.now() };
  let cloudOk = false;
  try {
    await sbFetch("reservations", {
      method: "POST",
      body: JSON.stringify([{ id: rec.id, name: rec.name, phone: rec.phone, dept: rec.dept || "", booker: rec.by || "", book_date: rec.date || "", book_time: rec.time || "", people: rec.people, note: rec.note || "", ts: rec.ts }])
    });
    cloudOk = true;
  } catch (err) { cloudOk = false; }
  if (!cloudOk) {
    try {
      const list = (await idbGet("reservations")) || [];
      list.push(rec);
      await idbPut("reservations", list);
    } catch (err) { /* 保存失败不阻塞 */ }
  }
  window.location.href = "menu.html";
});


/* ============ 轻提示 ============ */
let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}
</script>
