<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加载页预览</title>
<style>
:root{--paper:#f5f0e4;--ink:#2f3a34;--sub:#7a8078;--gold:#b09a68;--celadon:#5f7f79}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);font-family:"Songti SC","SimSun","宋体",serif;color:var(--ink)}
.loader-preview{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.pl-logo{height:42px;width:auto;margin:0 auto 14px;display:block;filter:drop-shadow(0 2px 6px rgba(47,58,52,.18))}
.pl-name{font-size:22px;letter-spacing:9px;font-weight:700}
.pl-sub{font-size:11px;letter-spacing:4px;color:var(--gold);margin-top:6px}
.pl-verse{font-family:"Kaiti SC","KaiTi","楷体",serif;font-size:14px;color:var(--gold);letter-spacing:3px;margin-top:14px}
.pl-dots{display:flex;justify-content:center;gap:9px;margin-top:22px}
.pl-dots span{width:9px;height:9px;border-radius:50%;background:var(--celadon);animation:plb 1s infinite ease-in-out}
.pl-dots span:nth-child(2){animation-delay:.15s}
.pl-dots span:nth-child(3){animation-delay:.3s}
@keyframes plb{0%,80%,100%{transform:scale(.6);opacity:.35}40%{transform:scale(1);opacity:1}}
.pl-text{font-size:12px;color:var(--sub);letter-spacing:3px;margin-top:12px}
.loader-preview .mount{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;pointer-events:none;opacity:.8}
.loader-preview{position:relative;overflow:hidden}
.note{margin-top:46px;font-size:13px;color:var(--sub);letter-spacing:1px;line-height:2;max-width:320px}
.note b{color:var(--celadon)}
</style>
</head>
<body>
<div class="loader-preview">
  <div class="pl-inner">
    <img class="pl-logo" src="images/logo.png" alt="赛尔美餐厅">
    <div class="pl-name">赛尔美餐厅</div>
    <div class="pl-sub">SMISS Restaurant</div>
    <div class="pl-verse">一席烟火气，万般皆如意</div>
    <div class="pl-dots"><span></span><span></span><span></span></div>
    <div class="pl-text">正在为您加载菜单…</div>
  </div>
<svg class="mount" viewBox="0 0 1440 320" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <path fill="#5f7f79" opacity=".09" d="M0,180 C180,120 260,220 430,155 C600,95 760,200 940,140 C1100,90 1260,175 1440,120 L1440,320 L0,320 Z"/>
  <path fill="#5f7f79" opacity=".06" d="M0,240 C160,195 320,260 520,205 C720,150 900,250 1120,200 C1280,155 1380,220 1440,190 L1440,320 L0,320 Z"/>
  <path fill="#b09a68" opacity=".06" d="M0,275 C300,225 520,290 760,245 C980,210 1220,280 1440,235 L1440,320 L0,320 Z"/>
</svg>
  <div class="note">
    这是<b>加载页预览</b>：实际打开页面时，加载动画显示后会<u>自动消失</u>。<br>
    点菜页显示「正在为您加载菜单…」；首页、管理端显示「正在加载…」。
  </div>
</div>
</body>
</html>
